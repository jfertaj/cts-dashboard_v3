name: Playwright E2E (Nightly — deterministic + smoke)

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC every day
  workflow_dispatch:       # manual trigger

jobs:
  e2e-nightly:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start preview server + run deterministic E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
          CI: "true"
        run: |
          npm run preview &
          sleep 3
          npx playwright test --project=chromium

      - name: Run smoke tests (if SF_SESSION_COOKIE is set)
        if: env.SF_SESSION_COOKIE != ''
        env:
          PLAYWRIGHT_SMOKE: "1"
          SF_SESSION_COOKIE: ${{ secrets.SF_SESSION_COOKIE }}
          PLAYWRIGHT_BASE_URL: http://localhost:4173
          CI: "true"
        run: npx playwright test --grep @smoke --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nightly
          path: frontend/playwright-report/
          retention-days: 30
