name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly run for smoke suite
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC every night
  # Manual trigger (enables smoke tests via input)
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run live smoke tests (requires SF_SESSION_COOKIE secret)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

env:
  # Vite dev server port (must match playwright.config.ts PLAYWRIGHT_BASE_URL default)
  VITE_PORT: 8080

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # JOB 1: Deterministic suite — runs on every PR and push
  # No real Claude calls, no SF session required.
  # ──────────────────────────────────────────────────────────────────────
  e2e-deterministic:
    name: E2E — deterministic (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # Google Maps key not needed in tests (map falls back gracefully)
          VITE_GOOGLE_MAPS_API_KEY: ""

      - name: Start preview server
        working-directory: frontend
        run: |
          npx vite preview --port ${{ env.VITE_PORT }} &
          # Wait up to 15s for server to be ready
          for i in $(seq 1 15); do
            curl -sf http://localhost:${{ env.VITE_PORT }} && break || sleep 1
          done

      - name: Run deterministic E2E tests
        working-directory: frontend
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:${{ env.VITE_PORT }}"
          CI: "true"
          # Smoke tests are NOT enabled here
          PLAYWRIGHT_SMOKE: ""

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-deterministic-${{ github.run_number }}
          path: frontend/playwright-report/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────
  # JOB 2: Live smoke suite — runs nightly OR on manual dispatch with run_smoke=true
  # Calls real Claude API + real Salesforce. Failure does NOT block PR.
  # ──────────────────────────────────────────────────────────────────────
  e2e-smoke:
    name: E2E — live smoke (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run on schedule OR when manually triggered with run_smoke=true
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_smoke == 'true')
    # Smoke failures are informational — do NOT block the PR or main branch
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ""

      - name: Start preview server
        working-directory: frontend
        run: |
          npx vite preview --port ${{ env.VITE_PORT }} &
          for i in $(seq 1 15); do
            curl -sf http://localhost:${{ env.VITE_PORT }} && break || sleep 1
          done

      - name: Run deterministic + live smoke tests
        working-directory: frontend
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:${{ env.VITE_PORT }}"
          CI: "true"
          PLAYWRIGHT_SMOKE: "1"
          SF_SESSION_COOKIE: ${{ secrets.SF_SESSION_COOKIE }}
          # CHAT_TIMEOUT raised for Claude calls
          CHAT_TIMEOUT: "120"

      - name: Upload Playwright report (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke-${{ github.run_number }}
          path: frontend/playwright-report/
          retention-days: 7
