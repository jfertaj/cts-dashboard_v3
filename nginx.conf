# Define the events block
events {
    worker_connections 1024;  # Adjust based on your needs
}

http {
  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Increase the maximum allowed upload size
    client_max_body_size 10M;  # Adjust the size as needed (e.g., 10MB, 100MB, etc.)

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Add the following to serve JS with the correct MIME type
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
  }
}