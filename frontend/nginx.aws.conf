server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Tamaño máximo de subida (ajústalo si necesitas más)
  client_max_body_size 50M;

  # Healthcheck para ECS/ALB
  location = /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # Los assets llevan hash de contenido en el nombre (index-Bsg2Jap4.js): si cambia
  # el contenido, cambia el nombre. Así que se pueden cachear para siempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html NUNCA se cachea: es el índice que decide qué assets cargar y cambia en
  # cada deploy. Antes no emitíamos ninguna cabecera de caché, así que el navegador
  # aplicaba su heurística, se quedaba con el index.html viejo y seguía pidiendo el
  # bundle antiguo — el usuario veía la app anterior después de un deploy correcto.
  # Pasó el 2026-07-14: el deploy estaba bien, el navegador no se enteraba.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # SPA: sirve index.html para rutas que no existan
  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}