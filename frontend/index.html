<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#003f7d" />
    <link rel="icon" href="/favicon.ico" />

    <!-- Leaflet CSS (SIN integrity para evitar el bloqueo que estás viendo) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>CTS Dashboard</title>

    <style>
      :root {
        --innodia-blue: #003f7d;
        --innodia-teal: #00a0a3;
        --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, Segoe UI,
          Roboto, Noto Sans, Ubuntu, Cantarell, "Helvetica Neue", Arial;
      }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        font-family: var(--font-sans);
        background: #f6f9fb;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Enable JavaScript to use CTS Dashboard.</noscript>
    <script type="module" src="/src/main.tsx"></script>
