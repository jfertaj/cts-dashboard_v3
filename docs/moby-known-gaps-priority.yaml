  - group_id: G1
    title: "Numeric thresholds silently ignored"
    priority: CLOSED  # was HIGH — fixed in Step 18 (2026-03-25)
    description: >
      When users specify numeric thresholds (">50", ">30", ">100"), the deterministic
      planner handlers (stage, T1D) return all matching rows without applying the
      threshold filter. The constraint is silently dropped.
    impact: "HIGH — users get wrong results and may not notice the threshold was ignored"
    estimated_fix_complexity: "LOW — post-filter on returned rows, similar to GQ02 fix"
    why_it_matters: >
      Feasibility assessments depend on precise thresholds. Getting 37 sites instead
      of 8 undermines trust in Moby for study planning.
    recommended_order: 1
    suggested_next_action: >
      Add threshold post-filter to stage_handler and T1D handler, same pattern as
      the GQ02 is_basic_site_count threshold fix already implemented.
    questions:
      - question_id: SC02
        short_label: "Stage 1 > 50"
        observed_behavior: "37 rows (all Stage 1 > 0) instead of >50"
        likely_root_cause: "stage_handler has no threshold extraction"
        confidence: high
      - question_id: FA02
        short_label: "Stage 1 > 30"
        observed_behavior: "37 rows (same as SC02)"
        likely_root_cause: "Same handler, same gap"
        confidence: high
      # MC03 reclassified to G2 (2026-03-25): threshold regex DOES match,
      # but the T1D filter rule is added to Explorer and silently dropped.
      # See G2 for MC03.

  - group_id: G2
    title: "Filter / constraint silently dropped"
    priority: CLOSED  # was HIGH — fixed in Steps 19-25 (2026-03-25)
    description: >
      Secondary filters in complex queries are silently ignored. The handler matches
      the primary intent but drops additional constraints (CTS-validated, validated role,
      time window, proposed-vs-validated, first-contact existence).
    impact: "HIGH — results include rows that should be excluded, leading to wrong counts"
    estimated_fix_complexity: "MEDIUM — each constraint type needs its own detection + filter logic"
    why_it_matters: >
      Users combine constraints naturally ("pharmacy AND CTS-validated", "no assignment
      in last 2 years"). Dropping any constraint makes the answer unreliable.
    recommended_order: 2
    suggested_next_action: >
      Audit each handler for constraint pass-through. Add CTS-validated as a recognized
      qualifier. Add temporal constraints to assignment handler.
    questions:
      - question_id: SC08
        short_label: "Pharmacy + CTS-validated"
        observed_behavior: "37 pharmacy sites — CTS-validated filter not applied"
        likely_root_cause: "qual_handler doesn't recognize 'CTS-validated' as Account-level boolean"
        confidence: medium
      - question_id: SS05
        short_label: "Referral/Clinical Partner role"
        observed_behavior: "0 rows — queried Account field but got empty"
        likely_root_cause: "Account-level boolean filter approach may be wrong for RP role"
        confidence: medium
      - question_id: SS02
        short_label: "First contact + no meeting"
        observed_behavior: "180 rows — only checked 'no meeting', not 'has first contact'"
        likely_root_cause: "Pipeline handler matched 'no meeting date' only, ignored conjunction"
        confidence: medium
      - question_id: RE04
        short_label: "Sites per country with validated role"
        observed_behavior: "25 countries (all) — 'validated role' constraint dropped"
        likely_root_cause: "is_basic_site_count doesn't parse additional qualifiers"
        confidence: high
      - question_id: OC03
        short_label: "Proposed CS not validated"
        observed_behavior: "214 institutions — no proposed/validated distinction"
        likely_root_cause: "members_search doesn't distinguish proposed from validated status"
        confidence: high
      - question_id: BR03
        short_label: "No assignment in last 2 years"
        observed_behavior: "56 sites (same as 'no assignment ever')"
        likely_root_cause: "not_in_assignment handler has no temporal filter"
        confidence: high
      - question_id: MC03
        short_label: "HLA + overnight + T1D > 100 (IT/ES)"
        observed_behavior: "14 rows — HLA+overnight applied but T1D >100 threshold dropped"
        likely_root_cause: "qual_handler adds T1D gt rule to Explorer filter but it is silently not applied (moved from G1 — threshold regex works, filter enforcement fails)"
        confidence: high

  - group_id: G3
    title: "Misrouting / intent misparse"
    priority: CLOSED  # Steps 26-31: SP05, SS06, SC07, QI02, GL05 all fixed.
    description: >
      The query is routed to the wrong handler or the handler misparses the user's
      intent. Examples: country name parsed as activity name, percentage question
      parsed as activity lookup, site query routed to members search.
    impact: "HIGH — completely wrong answer or 0 rows"
    estimated_fix_complexity: "MEDIUM — needs better intent classification or guard clauses"
    why_it_matters: >
      These produce obviously wrong answers (0 rows, wrong entity type) which
      immediately erode user trust.
    recommended_order: 3
    suggested_next_action: >
      Add guards: (1) country names should not be parsed as activity names,
      (2) percentage/proportion queries need a new handler or Claude routing,
      (3) 'mechanistic studies' should route to sites, not members.
    questions:
      - question_id: SP05
        short_label: "Assignments in Germany"
        observed_behavior: "0 rows — 'in germany' treated as activity name"
        likely_root_cause: "Activity handler captures everything after 'assignment' as name"
        confidence: high
      - question_id: SS06
        short_label: "Percentage participating"
        observed_behavior: "0 rows — 'at least 1 activity' parsed as activity name"
        likely_root_cause: "No percentage/proportion handler exists"
        confidence: high
      - question_id: QI02
        short_label: "Mechanistic studies (sites)"
        observed_behavior: "0 rows — searched members instead of sites"
        likely_root_cause: "'mechanistic' keyword triggered members_search (Research/Mechanistic Lab role)"
        confidence: high
      - question_id: GL05
        short_label: "Driving distance + pharmacy"
        observed_behavior: "9 rows but garbled answer — grouping formatter intercepted"
        likely_root_cause: "Answer formatter matched before geographic formatter"
        confidence: medium
      - question_id: SC07
        short_label: "ND T1D field confusion"
