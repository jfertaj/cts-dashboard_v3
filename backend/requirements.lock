# Versiones EXACTAS del backend — no editar a mano.
#
# Foto de `pip freeze` de la imagen cts-dashboard-backend:20260714-135031, que es
# la que corre en producción y está verificada contra Salesforce (búsqueda 200,
# relleno 200, 81/215 centros con cribados).
#
# Por qué existe este fichero: requirements.txt no fijaba ninguna versión, así que
# cada `docker build` se traía lo último de ese día. El 2026-07-14 eso trajo una
# FastAPI más nueva que la de junio, el backend dejó de arrancar (_IncludedRouter
# sin .path) y ECS revirtió el deploy entero. La misma commit construida en dos
# días distintos daba imágenes distintas.
#
# Cómo subir una dependencia (a propósito, no por accidente):
#   1. Cambia su versión aquí.
#   2. docker buildx build --platform linux/amd64 -f backend/Dockerfile.backend ./backend
#   3. Prueba el arranque y despliega. Si algo se rompe, sabes exactamente qué cambió.
#
# Para regenerar el lock entero desde una imagen que ya funciona:
#   docker run --rm --entrypoint sh <imagen> -c "pip freeze" \
#     | grep -viE "^(pip|setuptools|wheel)==" | sort
#
